<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoBonk</title>
<script>
try {
  if (localStorage.getItem("autobonk-theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch (error) {}
</script>
<style>
  :root {
    color-scheme: light;
    --desk: #2a2118;
    --glow: #f3c56b;
    --card: #fff8ec;
    --ink: #2a2118;
    --muted: #3d3428;
    --line: #2a2118;
    --shadow: #e2a23a;
    --rule: #eadcc4;
    --th: #7a6a55;
    --link: #8a4b08;
    --field: #fff;
    --sheet: #fff;
    --call: #1f7a4d;
    --put: #a33b4a;
    --bar: #3a2d22;
    --brand: #fff8ec;
    --status: #f6e7c8;
    --pill: #fff8ec;
    --pill-ink: #2a2118;
    --current: #f3c56b;
    --group: #f0c27a;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --desk: #100e0c;
    --glow: #5c4318;
    --card: #241c16;
    --ink: #f6efe4;
    --muted: #e4d8c8;
    --line: #e2a23a;
    --shadow: #6b4a16;
    --rule: #3d3228;
    --th: #cbbba4;
    --link: #f0c27a;
    --field: #1a1511;
    --sheet: #1a1511;
    --call: #7dcea0;
    --put: #f0a0a0;
    --bar: #1a1511;
    --brand: #f6efe4;
    --status: #d9cbb6;
    --pill: #2c241c;
    --pill-ink: #f6efe4;
    --current: #e2a23a;
    --group: #e2a23a;
  }
  body { margin: 0; background:
      radial-gradient(circle at 12% -10%, var(--glow) 0, transparent 32%),
      var(--desk); color: var(--ink);
    font: 16px/1.45 "Nunito", "Segoe UI", system-ui, sans-serif; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap;
    align-items: center; gap: 10px 16px; padding: 10px 18px;
    background: var(--bar); border-bottom: 3px solid var(--line); }
  .brand { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 1.6rem;
    font-weight: 700; letter-spacing: -0.03em; color: var(--brand); text-decoration: none; }
  .stamp { display: inline-block; margin-left: 8px; padding: 2px 8px; border: 3px solid var(--brand);
    border-radius: 10px; transform: rotate(-6deg); font-size: 0.72rem; font-weight: 800; }
  .status { margin: 0; color: var(--status); font-size: 0.85rem; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: 1; }
  .nav-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .nav-group span { color: var(--group); font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.06em; text-transform: uppercase; }
  nav a { color: var(--pill-ink); background: var(--pill); text-decoration: none; font-weight: 800;
    border: 3px solid var(--line); border-radius: 999px; padding: 3px 10px;
    box-shadow: 3px 3px 0 var(--shadow); }
  nav a.is-current { background: var(--current); color: #1a140f; }
  #theme-toggle { margin-left: auto; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 22px 64px; }
  h2 { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; margin: 0 0 12px; color: var(--ink); }
  h3 { font-family: "Iowan Old Style", Palatino, Georgia, serif; margin: 16px 0 6px; color: var(--ink); }
  section { background: var(--card); color: var(--ink); border: 3px solid var(--line); border-radius: 18px;
    box-shadow: 7px 7px 0 var(--shadow); padding: 16px 18px 8px; margin: 0 0 16px;
    scroll-margin-top: 108px; }
  p, li { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; vertical-align: top;
    border-bottom: 1px solid var(--rule); color: var(--ink); }
  th { color: var(--th); font-size: 0.75rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
  th[aria-sort="ascending"]::after { content: " \2191"; }
  th[aria-sort="descending"]::after { content: " \2193"; }
  td.ticker { font-weight: 800; }
  td.call, td.up { color: var(--call); font-weight: 800; }
  td.put, td.down { color: var(--put); font-weight: 800; }
  a { color: var(--link); }
  .knobs { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  label { font-size: 0.85rem; font-weight: 800; color: var(--ink); }
  input, select, button { font: inherit; color: var(--ink); background: var(--field);
    border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; }
  button { font-weight: 800; background: var(--current); color: #1a140f;
    box-shadow: 3px 3px 0 var(--line); cursor: pointer; }
  pre.sheet { white-space: pre-wrap; background: var(--sheet); color: var(--ink);
    border-radius: 12px; padding: 12px; max-height: 420px; overflow: auto; }
  #backtest-out { margin-top: 8px; }
  details { margin: 8px 0 12px; }
  summary { font-weight: 800; cursor: pointer; color: var(--ink); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 8px; margin: 8px 0 12px; }
  .metric { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--sheet); }
  .metric span { display: block; color: var(--th); font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; }
  .metric strong { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .equity { width: 100%; height: 140px; display: block; }
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="#trades">AutoBonk <span class="stamp">BONK</span></a>
<nav>__NAV__</nav>
<button type="button" id="theme-toggle" aria-pressed="false">Dark</button>
<p class="status">Paper session. A row on this page is not an order.</p>
<p class="status" id="loaded">Loaded</p>
</header>
<main>
__BODY__
</main>
<script>
document.getElementById("loaded").textContent = "Loaded " + new Intl.DateTimeFormat("en-US", {
  timeZone: "America/Los_Angeles",
  month: "short",
  day: "numeric",
  hour: "numeric",
  minute: "2-digit",
  hour12: true,
  timeZoneName: "short"
}).format(new Date());

function applyTheme(theme) {
  const dark = theme === "dark";
  if (dark) document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  const toggle = document.getElementById("theme-toggle");
  if (!toggle) return;
  toggle.textContent = dark ? "Light" : "Dark";
  toggle.setAttribute("aria-pressed", dark ? "true" : "false");
}

const themeToggle = document.getElementById("theme-toggle");
if (themeToggle) {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem("autobonk-theme", next); } catch (error) {}
    applyTheme(next);
  });
}

const navLinks = Array.from(document.querySelectorAll("nav a[href^='#']"));
const navSections = navLinks
  .map((link) => document.getElementById(link.getAttribute("href").slice(1)))
  .filter(Boolean);
function markCurrent(id) {
  navLinks.forEach((link) => {
    const on = link.getAttribute("href") === "#" + id;
    link.classList.toggle("is-current", on);
    if (on) link.setAttribute("aria-current", "location");
    else link.removeAttribute("aria-current");
  });
}
if (navSections.length && "IntersectionObserver" in window) {
  const seen = new IntersectionObserver((entries) => {
    const visible = entries
      .filter((entry) => entry.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (visible) markCurrent(visible.target.id);
  }, { rootMargin: "-120px 0px -55% 0px", threshold: [0.15, 0.4] });
  navSections.forEach((section) => seen.observe(section));
}
const firstOnPage = navSections.slice().sort((a, b) => a.offsetTop - b.offsetTop)[0];
if (location.hash) markCurrent(location.hash.slice(1));
else if (firstOnPage) markCurrent(firstOnPage.id);

function sortKey(text) {
  const raw = text.replace(/\s+mark$/i, "").trim();
  if (raw === "" || raw.toLowerCase() === "open" || raw.toLowerCase() === "none") {
    return { empty: true, n: 0, t: "" };
  }
  const numeric = raw.replace(/[$,%]/g, "");
  if (/^[+-]?\d+(?:\.\d+)?$/.test(numeric)) {
    return { empty: false, n: Number(numeric), t: raw.toLowerCase() };
  }
  return { empty: false, n: NaN, t: raw.toLowerCase() };
}

function compareKeys(a, b) {
  if (a.empty && b.empty) return 0;
  if (a.empty) return 1;
  if (b.empty) return -1;
  if (!Number.isNaN(a.n) && !Number.isNaN(b.n)) return a.n - b.n;
  if (a.t < b.t) return -1;
  if (a.t > b.t) return 1;
  return 0;
}

function applySort(table, col, dir) {
  const body = table.tBodies[0];
  if (!body) return;
  const pinned = [];
  const rows = [];
  Array.from(body.rows).forEach((row) => {
    if (row.hasAttribute("data-stay")) pinned.push(row);
    else rows.push(row);
  });
  rows.sort((left, right) => {
    const a = sortKey(left.cells[col] ? left.cells[col].textContent : "");
    const b = sortKey(right.cells[col] ? right.cells[col].textContent : "");
    if (a.empty || b.empty) return compareKeys(a, b);
    return compareKeys(a, b) * dir;
  });
  rows.concat(pinned).forEach((row) => body.appendChild(row));
  Array.from(table.tHead.rows[0].cells).forEach((th, index) => {
    th.setAttribute("aria-sort", index === col ? (dir > 0 ? "ascending" : "descending") : "none");
  });
}

document.querySelectorAll("section").forEach((section) => {
  const name = section.querySelector("h2").textContent;
  section.querySelectorAll("table").forEach((table, index) => {
    if (!table.tHead || table.hasAttribute("data-nosort")) return;
    const key = "autobonk-sort:" + name + ":" + index;
    Array.from(table.tHead.rows[0].cells).forEach((th, col) => {
      th.tabIndex = 0;
      const sort = () => {
        const dir = th.getAttribute("aria-sort") === "ascending" ? -1 : 1;
        applySort(table, col, dir);
        sessionStorage.setItem(key, JSON.stringify({ col: col, dir: dir }));
      };
      th.addEventListener("click", sort);
      th.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          sort();
        }
      });
    });
    let saved = null;
    try {
      saved = JSON.parse(sessionStorage.getItem(key) || "null");
    } catch (error) {
      saved = null;
    }
    if (saved && Number.isInteger(saved.col)) {
      applySort(table, saved.col, saved.dir === -1 ? -1 : 1);
    }
  });
});

function money(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "";
  const rounded = Math.round(value * 100) / 100;
  const text = Math.abs(rounded).toFixed(Math.abs(rounded % 1) < 0.001 ? 0 : 2);
  if (rounded > 0) return "+$" + text;
  if (rounded < 0) return "-$" + text;
  return "$0";
}

function points(value) {
  if (value === null || value === undefined) return "";
  return (value > 0 ? "+" : "") + Number(value).toFixed(2);
}

function factor(stats) {
  if (!stats || stats.trades === 0) return "—";
  if (stats.profit_factor === null) return stats.net > 0 ? "no losses" : "0.00";
  return Number(stats.profit_factor).toFixed(2);
}

function percent(value) {
  if (value === null || value === undefined) return "";
  return (value > 0 ? "+" : "") + (Number(value) * 100).toFixed(1) + "%";
}

function share(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "";
  return (Number(value) * 100).toFixed(1) + "%";
}

function cell(row, text, className) {
  const td = document.createElement("td");
  td.textContent = text;
  if (className) td.className = className;
  row.appendChild(td);
  return td;
}

function ratio(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "—";
  return Number(value).toFixed(2);
}

function metric(label, text, className) {
  const box = document.createElement("div");
  box.className = "metric";
  const name = document.createElement("span");
  name.textContent = label;
  const value = document.createElement("strong");
  value.textContent = text || "—";
  if (className) value.className = className;
  box.append(name, value);
  return box;
}

function tone(value) {
  if (value > 0) return "up";
  if (value < 0) return "down";
  return "";
}

function overview(report) {
  const stats = report.summary.strategy;
  const hold = report.buy_hold || {};
  const grid = document.createElement("div");
  grid.className = "metrics";
  const drawdown = stats.max_drawdown_percent == null
    ? points(-stats.max_drawdown)
    : points(-stats.max_drawdown) + " (" + (stats.max_drawdown_percent * 100).toFixed(1) + "% of peak)";
  const cards = [
    ["Net points", points(stats.net) + (stats.return == null ? "" : " (" + percent(stats.return) + ")"), tone(stats.net)],
    ["Gross profit", points(stats.gross_profit), tone(stats.gross_profit)],
    ["Gross loss", points(-stats.gross_loss), stats.gross_loss ? "down" : ""],
    ["Profit factor", factor(stats), ""],
    ["Max drawdown", drawdown, stats.max_drawdown ? "down" : ""],
    ["Expected payoff", points(stats.expected), tone(stats.expected)],
    ["Closed net", points(stats.closed_net), tone(stats.closed_net)],
    ["Open points", points(stats.open_points) + " (" + stats.open_trades + ")", tone(stats.open_points)],
    ["Buy and hold", points(hold.points) + (hold.return == null ? "" : " (" + percent(hold.return) + ")"), tone(hold.points)],
    ["Total trades", String(stats.trades), ""],
    ["Win rate", share(stats.win_rate), ""],
    ["Winning trades", String(stats.wins), ""],
    ["Losing trades", String(stats.losses), ""],
    ["Breakeven", String(stats.breakeven), ""],
    ["Avg winning trade", points(stats.avg_win), tone(stats.avg_win)],
    ["Avg losing trade", points(stats.avg_loss), tone(stats.avg_loss)],
    ["Payoff ratio", ratio(stats.payoff_ratio), ""],
    ["Largest win", points(stats.largest_win), tone(stats.largest_win)],
    ["Largest loss", points(stats.largest_loss), tone(stats.largest_loss)],
    ["Max win streak", String(stats.max_win_streak), ""],
    ["Max loss streak", String(stats.max_loss_streak), ""]
  ];
  cards.forEach((card) => grid.appendChild(metric(card[0], card[1], card[2])));
  return grid;
}

function equityChart(values) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 600 140");
  svg.setAttribute("class", "equity");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Equity curve");
  if (!values || !values.length) return svg;
  const min = Math.min(0, ...values);
  const max = Math.max(0, ...values);
  const span = max - min || 1;
  const coords = values.map((value, index) => {
    const x = values.length === 1 ? 300 : (index / (values.length - 1)) * 600;
    const y = 128 - ((value - min) / span) * 112;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const zero = 128 - ((0 - min) / span) * 112;
  const axis = document.createElementNS(svg.namespaceURI, "line");
  axis.setAttribute("x1", "0");
  axis.setAttribute("x2", "600");
  axis.setAttribute("y1", String(zero));
  axis.setAttribute("y2", String(zero));
  axis.setAttribute("stroke", "currentColor");
  axis.setAttribute("stroke-opacity", "0.35");
  const path = document.createElementNS(svg.namespaceURI, "polyline");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "2");
  path.setAttribute("points", coords.join(" "));
  svg.append(axis, path);
  return svg;
}

function tradeTable(trades) {
  const wrap = document.createElement("details");
  const heading = document.createElement("summary");
  heading.textContent = trades.length + (trades.length === 1 ? " trade" : " trades");
  wrap.appendChild(heading);
  if (!trades.length) {
    const empty = document.createElement("p");
    empty.textContent = "No round trip on these bars.";
    wrap.appendChild(empty);
    return wrap;
  }
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["Time", "Ticker", "Side", "Level", "Exit", "Points", "Return"].forEach((name) => {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  });
  const thead = document.createElement("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const body = document.createElement("tbody");
  trades.forEach((trade) => {
    const row = document.createElement("tr");
    cell(row, trade.time);
    cell(row, trade.ticker, "ticker");
    cell(row, trade.side, trade.side === "put" ? "put" : "call");
    cell(row, Number(trade.level).toFixed(2));
    cell(row, trade.marked ? "open mark" : trade.exit_reason);
    cell(row, points(trade.points), tone(trade.points));
    cell(row, percent(trade.return), tone(trade.return));
    body.appendChild(row);
  });
  table.appendChild(body);
  wrap.appendChild(table);
  return wrap;
}

function comparison(runs) {
  const wrap = document.createElement("div");
  const heading = document.createElement("h3");
  heading.textContent = "Exit comparison";
  wrap.appendChild(heading);
  const note = document.createElement("p");
  note.textContent = "Live stays the retest and the target exit. The other columns use the entry and buffers above, each with its own exit.";
  wrap.appendChild(note);
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["Test", "Trades", "Win rate", "Net points", "Return", "Profit factor", "Max drawdown", "Expected"].forEach((name) => {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  });
  const thead = document.createElement("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const body = document.createElement("tbody");
  runs.forEach((run) => {
    const stock = run.summary.strategy;
    const row = document.createElement("tr");
    cell(row, run.name);
    cell(row, String(stock.trades));
    cell(row, share(stock.win_rate));
    cell(row, points(stock.net), tone(stock.net));
    cell(row, percent(stock.return));
    cell(row, factor(stock));
    cell(row, points(-stock.max_drawdown), stock.max_drawdown ? "down" : "");
    cell(row, points(stock.expected), tone(stock.expected));
    body.appendChild(row);
  });
  table.appendChild(body);
  wrap.appendChild(table);
  return wrap;
}

function renderReport(body) {
  const wrap = document.createElement("div");
  const report = body.report || body.runs[body.runs.length - 1];
  const windowInfo = body.window || {};
  const intro = document.createElement("p");
  const from = windowInfo.from && windowInfo.to ? (windowInfo.from + " to " + windowInfo.to + ". ") : "";
  const days = windowInfo.days && windowInfo.days.length ? (windowInfo.days.length + " saved sessions. ") : "";
  const missing = windowInfo.missing && windowInfo.missing.length
    ? (" No bars for " + windowInfo.missing.join(", ") + ".")
    : "";
  const note = windowInfo.note ? (" " + windowInfo.note) : "";
  intro.textContent = days + from + windowInfo.bars + " finished 10-minute bars. " +
    (windowInfo.source ? ("Source: " + windowInfo.source + ". ") : "") +
    missing + note;
  wrap.appendChild(intro);
  const settings = report.settings || {};
  const line = document.createElement("p");
  line.textContent = [
    "Entry " + (settings.entry || ""),
    "exit " + (settings.exit || ""),
    settings.stop_mode ? ("stop " + settings.stop_mode) : "",
    settings.take ? ("take " + settings.take) : "",
    settings.flatten ? ("clock " + settings.flatten) : "",
    "touch " + settings.touch,
    "chase " + settings.chase,
    "SMA band " + settings.sma_band,
    "ATR fraction " + settings.break_atr,
    "near " + settings.profit_near
  ].filter(Boolean).join(" · ");
  wrap.appendChild(line);
  wrap.appendChild(overview(report));
  wrap.appendChild(equityChart(report.summary.strategy.equity));
  wrap.appendChild(tradeTable(report.trades));
  if (body.runs) wrap.appendChild(comparison(body.runs));
  return wrap;
}

function rowValues(row) {
  const read = (name) => row.querySelector("[name=" + name + "]").value.trim();
  return {
    ticker: read("ticker").toUpperCase(),
    price: read("price"),
    allows: row.querySelector("[name=allows]").value,
    targets: read("targets"),
    up_targets: read("up_targets"),
    stop: read("stop"),
    note: read("note")
  };
}

function collectLevels() {
  return Array.from(document.querySelectorAll("#level-rows tr")).map((row) => {
    const values = rowValues(row);
    const split = (text) => text.split(",").map((item) => item.trim()).filter(Boolean).map(Number);
    const level = {
      ticker: values.ticker,
      price: values.price === "" ? "" : Number(values.price),
      allows: values.allows,
      targets: split(values.targets),
      note: values.note
    };
    if (values.up_targets) level.up_targets = split(values.up_targets);
    if (values.stop) level.stop = Number(values.stop);
    return level;
  }).filter((level) => level.ticker && level.price !== "");
}

function payload() {
  const num = (id) => {
    const value = document.getElementById(id).value.trim();
    if (value === "") return null;
    const number = Number(value);
    return Number.isNaN(number) ? null : number;
  };
  return {
    armed_at: document.getElementById("armed-at").value,
    levels: collectLevels(),
    bars: document.getElementById("bars-source").value,
    range: document.getElementById("bar-range").value,
    touch: num("touch"),
    chase: num("chase"),
    sma_band: num("sma-band"),
    break_atr: num("break-atr"),
    profit_near: num("profit-near"),
    entry: document.getElementById("entry").value,
    exit: document.getElementById("exit-rule").value,
    exit_test: document.getElementById("exit-test").value,
    stop_mode: document.getElementById("stop-mode").value,
    take: document.getElementById("take-mode").value,
    flatten: document.getElementById("flatten-mode").value
  };
}

function syncExitTest() {
  const custom = document.getElementById("exit-test").value === "custom";
  ["stop-mode", "take-mode", "flatten-mode"].forEach((id) => {
    const field = document.getElementById(id);
    if (field && field.parentElement) field.parentElement.hidden = !custom;
  });
}

function bindDesk() {
  const run = document.getElementById("run-backtest");
  if (!run) return;
  const exitTest = document.getElementById("exit-test");
  if (exitTest) {
    syncExitTest();
    exitTest.addEventListener("change", syncExitTest);
  }
  document.getElementById("add-level").addEventListener("click", () => {
    const body = document.getElementById("level-rows");
    const copy = body.rows[0].cloneNode(true);
    copy.querySelectorAll("input").forEach((input) => { input.value = ""; });
    body.appendChild(copy);
  });
  run.addEventListener("click", async () => {
    const out = document.getElementById("backtest-out");
    out.textContent = "Computing from the bars.";
    try {
      const response = await fetch("/api/backtest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload())
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || "The backtest failed.");
      out.replaceChildren(renderReport(body));
    } catch (error) {
      out.textContent = error.message + " Start the desk with python3 scripts/dashboard.py serve.";
    }
  });
  document.getElementById("save-book").addEventListener("click", async () => {
    const out = document.getElementById("backtest-out");
    const response = await fetch("/api/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ armed_at: document.getElementById("armed-at").value, levels: collectLevels() })
    });
    const body = await response.json();
    out.textContent = response.ok ? "Saved the book. That does not place an order." : (body.error || "The book was not saved.");
  });
}
bindDesk();
</script>
</body>
</html>
