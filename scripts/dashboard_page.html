<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoBonk</title>
<script>
try {
  if (localStorage.getItem("autobonk-theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch (error) {}
</script>
<style>
  :root {
    color-scheme: light;
    --desk: #2a2118;
    --glow: #f3c56b;
    --card: #fff8ec;
    --ink: #2a2118;

    --th: #7a6a55;
    --link: #8a4b08;
    --field: #fff;
    --sheet: #fff;
    --call: #1f7a4d;
    --put: #a33b4a;
    --bar: #3a2d22;
    --brand: #fff8ec;
    --status: #f6e7c8;
    --pill: #fff8ec;
    --pill-ink: #2a2118;
    --current: #f3c56b;

  }
  html[data-theme="dark"] {
    color-scheme: dark;

    --glow: #5c4318;
    --card: #241c16;
    --ink: #f6efe4;
    --muted: #e4d8c8;
    --line: #e2a23a;
    --shadow: #6b4a16;
    --rule: #3d3228;
    --th: #cbbba4;
    --link: #f0c27a;
    --field: #1a1511;
    --sheet: #1a1511;
    --call: #7dcea0;
    --put: #f0a0a0;
    --bar: #1a1511;
    --brand: #f6efe4;
    --status: #d9cbb6;

    --current: #e2a23a;
    --group: #e2a23a;
  }
  html { scroll-padding-top: 11.5rem; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background:
      radial-gradient(circle at 12% -10%, var(--glow) 0, transparent 32%),
      var(--desk); color: var(--ink);
    font: 16px/1.45 "Nunito", "Segoe UI", system-ui, sans-serif; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-direction: column;
    gap: 8px; width: 100%; max-width: 100%; padding: 12px 18px 10px;
    background: var(--bar); border-bottom: 3px solid var(--line); }
  .mast { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0; }
  .brand { flex: none; white-space: nowrap; font-family: "Iowan Old Style", Palatino, Georgia, serif;

    text-decoration: none; }
  .stamp { display: inline-block; margin-left: 8px; padding: 2px 8px; border: 3px solid var(--brand);
    border-radius: 10px; transform: rotate(-6deg); font-size: 0.72rem; font-weight: 800; }
  .status-line { display: flex; flex: 1 1 16rem; flex-wrap: wrap; gap: 2px 14px; min-width: 0; }

  .nav-group { display: flex; flex: 0 0 auto; flex-wrap: nowrap; gap: 6px; align-items: center;
    max-width: 100%; padding: 3px 4px 3px 10px; border-radius: 999px;

    background: color-mix(in srgb, var(--brand) 7%, transparent); }
  .nav-group span { color: var(--group); font-size: 0.68rem; font-weight: 800;

  nav a { color: var(--pill-ink); background: var(--pill); text-decoration: none; font-weight: 800;
    font-size: 0.92rem; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px;
    white-space: nowrap; }
  nav a.is-current { background: var(--current); color: #1a140f; }
  #theme-toggle { margin-left: auto; flex: none; }
  main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 18px 0 64px; }
  h2 { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; margin: 0 0 12px; color: var(--ink); }
  h3 { font-family: "Iowan Old Style", Palatino, Georgia, serif; margin: 16px 0 6px; color: var(--ink); }
  section { background: var(--card); color: var(--ink); border: 3px solid var(--line); border-radius: 18px;
    box-shadow: 7px 7px 0 var(--shadow); padding: 16px 18px 8px; margin: 0 0 16px;
    max-width: 100%; }
  p, li { color: var(--muted); }
  .sheet-scroll { overflow-x: auto; max-width: 100%; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 8px; vertical-align: top;
    border-bottom: 1px solid var(--rule); color: var(--ink); }
  th { color: var(--th); font-size: 0.75rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
  th[aria-sort="ascending"]::after { content: " \2191"; }
  th[aria-sort="descending"]::after { content: " \2193"; }
  table[data-nosort] th { cursor: default; }
  td.ticker { font-weight: 800; }
  td.call, td.up { color: var(--call); font-weight: 800; }
  td.put, td.down { color: var(--put); font-weight: 800; }
  td.paper { font-weight: 800; letter-spacing: 0.04em; text-transform: lowercase; }
  a { color: var(--link); }
  table.editor { width: 100%; }
  table.editor.levels, table.editor.levels thead, table.editor.levels tbody,
  table.editor.premiums, table.editor.premiums thead, table.editor.premiums tbody {
    display: block; width: 100%; }
  table.editor.levels tr, table.editor.premiums tr {
    display: grid; gap: 6px 8px; align-items: center;
    border-bottom: 1px solid var(--rule); padding: 6px 0; }
  table.editor.levels tr {
    grid-template-columns: 5.6rem 6.2rem 6.8rem minmax(0, 1.35fr) minmax(0, 1fr) 5.4rem; }
  table.editor.premiums tr {
    grid-template-columns: 6rem 6.2rem 6.6rem minmax(0, 1.5fr) minmax(5.5rem, 0.8fr) minmax(5.5rem, 0.8fr); }
  table.editor.levels th:nth-child(7), table.editor.levels td:nth-child(7) { grid-column: 1 / -1; }
  table.editor.levels thead th:nth-child(7) { display: none; }
  table.editor.levels td:nth-child(7)::before {
    content: "Note"; display: block; margin-bottom: 2px;
    color: var(--th); font-size: 0.68rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; }
  table.editor th, table.editor td {
    display: block; width: auto; min-width: 0; padding: 0; border: 0;
    overflow: visible; white-space: normal; }
  @media (max-width: 900px) {
    table.editor.levels tr, table.editor.premiums tr {
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); }
    table.editor.levels th:nth-child(7), table.editor.levels td:nth-child(7) { grid-column: 1 / -1; }
  }
  .knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    gap: 10px 12px; align-items: end; }
  .knobs label { display: flex; flex-direction: column; gap: 4px; min-width: 0;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .knobs label[hidden] { display: none !important; }
  .range-knob { display: flex; flex-direction: column; gap: 6px;
    border: 2px solid var(--rule); border-radius: 12px; padding: 8px; }
  .knobs label.tick { flex-direction: row; align-items: center; gap: 8px;
    text-transform: none; letter-spacing: 0; font-size: 0.85rem; font-weight: 700; }
  .knobs label.tick input { width: auto; }
  .bounds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bounds[hidden] { display: none !important; }
  .range-chart { margin: 4px 0 16px; }
  .range-chart h3 { margin: 0 0 4px; }
  .range-plot { width: 100%; height: 220px; display: block; }
  label { font-size: 0.85rem; font-weight: 800; color: var(--ink); }
  input, select, button { font: inherit; color: var(--ink); background: var(--field);
    border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; max-width: 100%; }
  table.editor input, table.editor select, .knobs input, .knobs select {
    width: 100%; min-width: 0; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font-weight: 800; background: var(--current); color: #1a140f;
    box-shadow: 3px 3px 0 var(--line); cursor: pointer; }
  pre.sheet { white-space: pre-wrap; background: var(--sheet); color: var(--ink);
    border-radius: 12px; padding: 12px; max-height: 420px; overflow: auto; }
  #backtest-out { margin-top: 8px; overflow-x: auto; max-width: 100%; }
  #backtest-out th, #backtest-out td { white-space: nowrap; }
  details { margin: 8px 0 12px; }
  summary { font-weight: 800; cursor: pointer; color: var(--ink); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 8px; margin: 8px 0 12px; }
  .metric { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--sheet); }
  .metric span { display: block; color: var(--th); font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; }
  .metric strong { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .equity { width: 100%; height: 140px; display: block; }
  @media (max-width: 560px) {
    .nav-group { flex-wrap: wrap; }
  }

  /* Overview. Chart colors are validated against --card in both modes (dataviz palette). */
  :root {
    --s1: #2a78d6; --s2: #eb6834; --gain: #2a78d6; --loss: #e34948;
    --grid: color-mix(in srgb, var(--ink) 12%, transparent);
    --good: #0ca30c; --critical: #d03b3b;
  }
  html[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --gain: #3987e5; --loss: #e66767; }
  .panel[hidden] { display: none; }
  .jump { font-size: 0.85rem; margin: 0 0 10px; color: var(--status); }
  .jump a { color: var(--brand); font-weight: 700; }
  .hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px 28px; align-items: end; margin-bottom: 14px; }
  .hero-label { display: block; color: var(--th); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .hero-value { display: block; font-size: 3.4rem; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); }
  .hero-note { margin: 4px 0 0; }
  .meter { height: 12px; border-radius: 999px; background: color-mix(in srgb, var(--s1) 18%, var(--card)); overflow: hidden; margin: 8px 0 6px; }
  .meter i { display: block; height: 100%; background: var(--s1); border-radius: 999px; }
  .freeze small, .tile small { display: block; color: var(--muted); font-size: 0.8rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 0 0 16px; }
  .tile { border: 2px solid var(--rule); border-radius: 14px; padding: 10px 12px; background: var(--sheet); min-width: 0; }
  .tile span { display: block; color: var(--th); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
  .tile strong { display: block; font-size: 1.35rem; font-weight: 800; color: var(--ink); }
  .tile.alert { border-color: var(--critical); }
  .tile.alert b { color: var(--critical); }
  .tile.ok b { color: var(--good); }
  .chart-card { border: 2px solid var(--rule); border-radius: 14px; padding: 10px 12px 4px; background: var(--card); margin: 0 0 12px; min-width: 0; }
  .chart-card h3 { margin: 2px 0 2px; font-size: 1rem; }
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 12px; }
  .sub, .empty { font-size: 0.85rem; color: var(--muted); margin: 2px 0 8px; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
  svg.chart .grid.zero { stroke: color-mix(in srgb, var(--ink) 35%, transparent); }
  svg.chart .tick, svg.chart .value, svg.chart .end-label { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  svg.chart .end-label { fill: var(--ink); font-weight: 700; }
  svg.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .line.s1 { stroke: var(--s1); } svg.chart .line.s2 { stroke: var(--s2); }
  svg.chart .dot { stroke: var(--card); stroke-width: 2; }
  svg.chart .dot.s1, svg.chart .bar.s1 { fill: var(--s1); }
  svg.chart .dot.s2, svg.chart .bar.s2 { fill: var(--s2); }
  svg.chart .hit { fill: transparent; cursor: pointer; outline: none; }
  svg.chart .hit:focus-visible { stroke: var(--ink); stroke-width: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 4px; font-size: 0.82rem; color: var(--muted); }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .swatch.s1 { background: var(--s1); } .swatch.s2 { background: var(--s2); }
  .tip { position: fixed; z-index: 50; pointer-events: none; max-width: 280px; padding: 6px 9px; border-radius: 8px;
    background: var(--ink); color: var(--card); font-size: 0.8rem; font-weight: 700; box-shadow: 0 4px 14px rgb(0 0 0 / 25%); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .chip { box-shadow: none; background: var(--pill); color: var(--pill-ink); border-radius: 999px; padding: 2px 12px; }
  .chip[aria-pressed="true"] { background: var(--current); color: #1a140f; }
  #ledger-table td, #ledger-table th { white-space: nowrap; }
  svg.chart.narrow-only { display: none; }
  @media (max-width: 720px) {
    svg.chart.wide-only { display: none; }
    svg.chart.narrow-only { display: block; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { grid-template-columns: 1fr; }
    .hero-value { font-size: 2.6rem; }
    .chart-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
<div class="mast">
<a class="brand" href="#trades">AutoBonk <span class="stamp">BONK</span></a>
<div class="status-line">
<p class="status">Live on the Agentic account. The checker sends qualifying entries and their exits. This page sends nothing.</p>
<p class="status" id="loaded">Loaded</p>
</div>
<button type="button" id="theme-toggle" aria-pressed="false">Dark</button>
</div>
<nav aria-label="Sections">__NAV__</nav>
</header>
<main>
__BODY__
</main>
<script>
document.getElementById("loaded").textContent = "Loaded " + new Intl.DateTimeFormat("en-US", {
  timeZone: "America/Los_Angeles",
  month: "short",
  day: "numeric",
  hour: "numeric",
  minute: "2-digit",
  hour12: true,
  timeZoneName: "short"
}).format(new Date());

function applyTheme(theme) {
  const dark = theme === "dark";
  if (dark) document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  const toggle = document.getElementById("theme-toggle");
  if (!toggle) return;
  toggle.textContent = dark ? "Light" : "Dark";
  toggle.setAttribute("aria-pressed", dark ? "true" : "false");
}

const themeToggle = document.getElementById("theme-toggle");
if (themeToggle) {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem("autobonk-theme", next); } catch (error) {}
    applyTheme(next);
  });
}

const tabLinks = Array.from(document.querySelectorAll("nav a[data-tab]"));
const panels = Array.from(document.querySelectorAll(".panel"));
function syncScrollPadding() {
  const bar = document.querySelector(".topbar");
  if (!bar) return;
  document.documentElement.style.scrollPaddingTop = Math.ceil(bar.getBoundingClientRect().height + 12) + "px";
}
syncScrollPadding();
window.addEventListener("resize", syncScrollPadding);

// A hash names a tab or a section. A section opens its tab, then scrolls to itself.
function showTab(tab, keepScroll) {
  panels.forEach((panel) => { panel.hidden = panel.dataset.panel !== tab; });
  tabLinks.forEach((link) => {
    const on = link.dataset.tab === tab;
    link.classList.toggle("is-current", on);
    link.setAttribute("aria-selected", on ? "true" : "false");
  });
  try { localStorage.setItem("autobonk-tab", tab); } catch (error) {}
  if (!keepScroll) window.scrollTo(0, 0);
}
function route() {
  const id = location.hash.slice(1);
  const target = id && document.getElementById(id);
  const panel = target && (target.classList.contains("panel") ? target : target.closest(".panel"));
  if (panel) {
    showTab(panel.dataset.panel, target !== panel);
    if (target !== panel) target.scrollIntoView();
    return;
  }
  let saved = "";
  try { saved = localStorage.getItem("autobonk-tab") || ""; } catch (error) {}
  const first = panels.find((p) => p.dataset.panel === saved) || panels[0];
  if (first) showTab(first.dataset.panel, true);
}
window.addEventListener("hashchange", route);
route();

// One floating tooltip for every chart mark with data-tip, on hover and on keyboard focus.
const tip = document.createElement("div");
tip.className = "tip";
tip.setAttribute("role", "tooltip");
tip.hidden = true;
document.body.appendChild(tip);
function placeTip(event, mark) {
  tip.textContent = mark.getAttribute("data-tip");
  tip.hidden = false;
  const box = mark.getBoundingClientRect();
  const x = event && event.clientX ? event.clientX : box.left + box.width / 2;
  const y = event && event.clientY ? event.clientY : box.top;
  const left = Math.min(Math.max(8, x + 12), window.innerWidth - tip.offsetWidth - 8);
  const top = y - tip.offsetHeight - 12 < 8 ? y + 16 : y - tip.offsetHeight - 12;
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
document.querySelectorAll("[data-tip]").forEach((mark) => {
  mark.addEventListener("mousemove", (event) => placeTip(event, mark));
  mark.addEventListener("focus", () => placeTip(null, mark));
  mark.addEventListener("mouseleave", () => { tip.hidden = true; });
  mark.addEventListener("blur", () => { tip.hidden = true; });
});

// Mode chips above the trades table.
document.querySelectorAll(".chips .chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const mode = chip.dataset.mode;
    chip.parentElement.querySelectorAll(".chip").forEach((other) => {
      other.setAttribute("aria-pressed", other === chip ? "true" : "false");
    });
    const table = document.getElementById("ledger-table");
    if (!table) return;
    Array.from(table.tBodies[0].rows).forEach((row) => {
      row.hidden = mode !== "all" && row.dataset.mode !== mode;
    });
  });
});

function sortKey(text) {
  const raw = text.replace(/\s+mark$/i, "").trim();
  if (raw === "" || raw.toLowerCase() === "open" || raw.toLowerCase() === "none") {
    return { empty: true, n: 0, t: "" };
  }
  const numeric = raw.replace(/[$,%]/g, "");
  if (/^[+-]?\d+(?:\.\d+)?$/.test(numeric)) {
    return { empty: false, n: Number(numeric), t: raw.toLowerCase() };
  }
  return { empty: false, n: NaN, t: raw.toLowerCase() };
}

function compareKeys(a, b) {
  if (a.empty && b.empty) return 0;
  if (a.empty) return 1;
  if (b.empty) return -1;
  if (!Number.isNaN(a.n) && !Number.isNaN(b.n)) return a.n - b.n;
  if (a.t < b.t) return -1;
  if (a.t > b.t) return 1;
  return 0;
}

function applySort(table, col, dir) {
  const body = table.tBodies[0];
  if (!body) return;
  const pinned = [];
  const rows = [];
  Array.from(body.rows).forEach((row) => {
    if (row.hasAttribute("data-stay")) pinned.push(row);
    else rows.push(row);
  });
  rows.sort((left, right) => {
    const a = sortKey(left.cells[col] ? left.cells[col].textContent : "");
    const b = sortKey(right.cells[col] ? right.cells[col].textContent : "");
    if (a.empty || b.empty) return compareKeys(a, b);
    return compareKeys(a, b) * dir;
  });
  rows.concat(pinned).forEach((row) => body.appendChild(row));
  Array.from(table.tHead.rows[0].cells).forEach((th, index) => {
    th.setAttribute("aria-sort", index === col ? (dir > 0 ? "ascending" : "descending") : "none");
  });
}

document.querySelectorAll("section").forEach((section) => {
  const name = section.querySelector("h2").textContent;
  section.querySelectorAll("table").forEach((table, index) => {
    if (!table.tHead || table.hasAttribute("data-nosort")) return;
    const key = "autobonk-sort:" + name + ":" + index;
    Array.from(table.tHead.rows[0].cells).forEach((th, col) => {
      th.tabIndex = 0;
      const sort = () => {
        const dir = th.getAttribute("aria-sort") === "ascending" ? -1 : 1;
        applySort(table, col, dir);
        sessionStorage.setItem(key, JSON.stringify({ col: col, dir: dir }));
      };
      th.addEventListener("click", sort);
      th.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          sort();
        }
      });
    });
    let saved = null;
    try {
      saved = JSON.parse(sessionStorage.getItem(key) || "null");
    } catch (error) {
      saved = null;
    }
    if (saved && Number.isInteger(saved.col)) {
      applySort(table, saved.col, saved.dir === -1 ? -1 : 1);
    }
  });
});

function money(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "";
  const rounded = Math.round(value * 100) / 100;
  const text = Math.abs(rounded).toFixed(Math.abs(rounded % 1) < 0.001 ? 0 : 2);
  if (rounded > 0) return "+$" + text;
  if (rounded < 0) return "-$" + text;
  return "$0";
}

function compact(value) {
  const text = Number(value).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
  return text === "-0" ? "0" : text;
}

function points(value) {
  if (value === null || value === undefined) return "";
  return (value > 0 ? "+" : "") + Number(value).toFixed(2);
}

function factor(stats) {
  if (!stats || stats.trades === 0) return "—";
  if (stats.profit_factor === null) return stats.net > 0 ? "no losses" : "0.00";
  return Number(stats.profit_factor).toFixed(2);
}

function percent(value) {
  if (value === null || value === undefined) return "";
  return (value > 0 ? "+" : "") + (Number(value) * 100).toFixed(1) + "%";
}

function share(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "";
  return (Number(value) * 100).toFixed(1) + "%";
}

function cell(row, text, className) {
  const td = document.createElement("td");
  td.textContent = text;
  if (className) td.className = className;
  row.appendChild(td);
  return td;
}

function ratio(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "—";
  return Number(value).toFixed(2);
}

function metric(label, text, className) {
  const box = document.createElement("div");
  box.className = "metric";
  const name = document.createElement("span");
  name.textContent = label;
  const value = document.createElement("strong");
  value.textContent = text || "—";
  if (className) value.className = className;
  box.append(name, value);
  return box;
}

function tone(value) {
  if (value > 0) return "up";
  if (value < 0) return "down";
  return "";
}

function overview(report) {
  const stats = report.summary.strategy;
  const hold = report.buy_hold || {};
  const grid = document.createElement("div");
  grid.className = "metrics";
  const drawdown = stats.max_drawdown_percent == null
    ? points(-stats.max_drawdown)
    : points(-stats.max_drawdown) + " (" + (stats.max_drawdown_percent * 100).toFixed(1) + "% of peak)";
  const cards = [
    ["Net points", points(stats.net) + (stats.return == null ? "" : " (" + percent(stats.return) + ")"), tone(stats.net)],
    ["Gross profit", points(stats.gross_profit), tone(stats.gross_profit)],
    ["Gross loss", points(-stats.gross_loss), stats.gross_loss ? "down" : ""],
    ["Profit factor", factor(stats), ""],
    ["Max drawdown", drawdown, stats.max_drawdown ? "down" : ""],
    ["Expected payoff", points(stats.expected), tone(stats.expected)],
    ["Closed net", points(stats.closed_net), tone(stats.closed_net)],
    ["Open points", points(stats.open_points) + " (" + stats.open_trades + ")", tone(stats.open_points)],
    ["Buy and hold", points(hold.points) + (hold.return == null ? "" : " (" + percent(hold.return) + ")"), tone(hold.points)],
    ["Total trades", String(stats.trades), ""],
    ["Win rate", share(stats.win_rate), ""],
    ["Winning trades", String(stats.wins), ""],
    ["Losing trades", String(stats.losses), ""],
    ["Breakeven", String(stats.breakeven), ""],
    ["Avg winning trade", points(stats.avg_win), tone(stats.avg_win)],
    ["Avg losing trade", points(stats.avg_loss), tone(stats.avg_loss)],
    ["Payoff ratio", ratio(stats.payoff_ratio), ""],
    ["Largest win", points(stats.largest_win), tone(stats.largest_win)],
    ["Largest loss", points(stats.largest_loss), tone(stats.largest_loss)],
    ["Max win streak", String(stats.max_win_streak), ""],
    ["Max loss streak", String(stats.max_loss_streak), ""]
  ];
  cards.forEach((card) => grid.appendChild(metric(card[0], card[1], card[2])));
  return grid;
}

function rangeChart(sweep) {
  const wrap = document.createElement("figure");
  wrap.className = "range-chart";
  const title = document.createElement("h3");
  title.textContent = sweep.label;
  const series = sweep.points || [];
  const best = series.reduce((pick, point) => {
    if (!pick || point.net > pick.net) return point;
    return pick;
  }, null);
  const same = series.length > 0 && series.every((point) => point.net === series[0].net);
  const caption = document.createElement("p");
  caption.textContent = series.length + " values from " + compact(sweep.low) + " to " + compact(sweep.high) + ". " +
    (best ? ("Best net " + points(best.net) + " at " + compact(best.value) + ". ") : "") +
    (same ? "Every value scored the same net. " : "") +
    "Only this buffer changes.";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 640 210");
  svg.setAttribute("class", "range-plot");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", sweep.label + ". " + caption.textContent);
  if (!series.length) {
    wrap.append(title, svg, caption);
    return wrap;
  }
  const nets = series.map((point) => point.net);
  const min = Math.min(0, ...nets);
  const max = Math.max(0, ...nets);
  const span = max - min || 1;
  const xOf = (index) => series.length === 1 ? 334 : 56 + (index / (series.length - 1)) * 572;
  const yOf = (value) => 168 - ((value - min) / span) * 150;
  const axis = document.createElementNS(svg.namespaceURI, "line");
  axis.setAttribute("x1", "56");
  axis.setAttribute("x2", "628");
  axis.setAttribute("y1", String(yOf(0)));
  axis.setAttribute("y2", String(yOf(0)));
  axis.setAttribute("stroke", "currentColor");
  axis.setAttribute("stroke-opacity", "0.35");
  const coords = series.map((point, index) => xOf(index).toFixed(1) + "," + yOf(point.net).toFixed(1));
  const path = document.createElementNS(svg.namespaceURI, "polyline");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "2");
  path.setAttribute("points", coords.join(" "));
  svg.append(axis, path);
  const mark = (text, x, y, anchor) => {
    const node = document.createElementNS(svg.namespaceURI, "text");
    node.setAttribute("x", String(x));
    node.setAttribute("y", String(y));
    node.setAttribute("fill", "currentColor");
    node.setAttribute("font-size", "12");
    if (anchor) node.setAttribute("text-anchor", anchor);
    node.textContent = text;
    svg.appendChild(node);
  };
  mark(points(max), 4, Math.max(14, yOf(max) + 4), null);
  if (min !== max) mark(points(min), 4, Math.min(180, yOf(min)), null);
  mark(compact(series[0].value), xOf(0), 196, "start");
  if (series.length > 1) mark(compact(series[series.length - 1].value), xOf(series.length - 1), 196, "end");
  series.forEach((point, index) => {
    const dot = document.createElementNS(svg.namespaceURI, "circle");
    const chosen = best && point.value === best.value && point.net === best.net;
    dot.setAttribute("cx", xOf(index).toFixed(1));
    dot.setAttribute("cy", yOf(point.net).toFixed(1));
    dot.setAttribute("r", chosen ? "5" : "3");
    dot.setAttribute("fill", chosen ? "var(--current)" : "currentColor");
    const tip = document.createElementNS(svg.namespaceURI, "title");
    tip.textContent = point.value + " · net " + points(point.net) + " · " + point.trades + " trades";
    dot.appendChild(tip);
    svg.appendChild(dot);
  });
  wrap.append(title, svg, caption);
  return wrap;
}

function equityChart(values) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 600 140");
  svg.setAttribute("class", "equity");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Equity curve");
  if (!values || !values.length) return svg;
  const min = Math.min(0, ...values);
  const max = Math.max(0, ...values);
  const span = max - min || 1;
  const coords = values.map((value, index) => {
    const x = values.length === 1 ? 300 : (index / (values.length - 1)) * 600;
    const y = 128 - ((value - min) / span) * 112;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const zero = 128 - ((0 - min) / span) * 112;
  const axis = document.createElementNS(svg.namespaceURI, "line");
  axis.setAttribute("x1", "0");
  axis.setAttribute("x2", "600");
  axis.setAttribute("y1", String(zero));
  axis.setAttribute("y2", String(zero));
  axis.setAttribute("stroke", "currentColor");
  axis.setAttribute("stroke-opacity", "0.35");
  const path = document.createElementNS(svg.namespaceURI, "polyline");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "2");
  path.setAttribute("points", coords.join(" "));
  svg.append(axis, path);
  return svg;
}

function tradeTable(trades) {
  const wrap = document.createElement("details");
  const heading = document.createElement("summary");
  heading.textContent = trades.length + (trades.length === 1 ? " trade" : " trades");
  wrap.appendChild(heading);
  if (!trades.length) {
    const empty = document.createElement("p");
    empty.textContent = "No round trip on these bars.";
    wrap.appendChild(empty);
    return wrap;
  }
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["Time", "Ticker", "Side", "Level", "Exit", "Points", "Return"].forEach((name) => {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  });
  const thead = document.createElement("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const body = document.createElement("tbody");
  trades.forEach((trade) => {
    const row = document.createElement("tr");
    cell(row, trade.time);
    cell(row, trade.ticker, "ticker");
    cell(row, trade.side, trade.side === "put" ? "put" : "call");
    cell(row, Number(trade.level).toFixed(2));
    cell(row, trade.marked ? "open mark" : trade.exit_reason);
    cell(row, points(trade.points), tone(trade.points));
    cell(row, percent(trade.return), tone(trade.return));
    body.appendChild(row);
  });
  table.appendChild(body);
  wrap.appendChild(table);
  return wrap;
}

function comparison(runs) {
  const wrap = document.createElement("div");
  const heading = document.createElement("h3");
  heading.textContent = "Exit comparison";
  wrap.appendChild(heading);
  const note = document.createElement("p");
  note.textContent = "Live stays the retest and the target exit. The other columns use the entry and buffers above, each with its own exit.";
  wrap.appendChild(note);
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["Test", "Trades", "Win rate", "Net points", "Return", "Profit factor", "Max drawdown", "Expected"].forEach((name) => {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  });
  const thead = document.createElement("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const body = document.createElement("tbody");
  runs.forEach((run) => {
    const stock = run.summary.strategy;
    const row = document.createElement("tr");
    cell(row, run.name);
    cell(row, String(stock.trades));
    cell(row, share(stock.win_rate));
    cell(row, points(stock.net), tone(stock.net));
    cell(row, percent(stock.return));
    cell(row, factor(stock));
    cell(row, points(-stock.max_drawdown), stock.max_drawdown ? "down" : "");
    cell(row, points(stock.expected), tone(stock.expected));
    body.appendChild(row);
  });
  table.appendChild(body);
  wrap.appendChild(table);
  return wrap;
}

function parameterDays(rows) {
  if (!rows || !rows.length) return null;
  const wrap = document.createElement("div");
  const heading = document.createElement("h3");
  heading.textContent = "Parameters";
  const note = document.createElement("p");
  note.textContent = "Old is the live checker. New is this test. Difference is the new day's stock points minus the old day's stock points.";
  wrap.append(heading, note);
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["Day", "Old", "New", "Difference"].forEach((name) => {
    const th = document.createElement("th");
    th.textContent = name;
    head.appendChild(th);
  });
  const thead = document.createElement("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const body = document.createElement("tbody");
  rows.forEach((row) => {
    const line = document.createElement("tr");
    cell(line, row.day);
    cell(line, points(row.old), tone(row.old));
    cell(line, points(row.new), tone(row.new));
    cell(line, points(row.difference), tone(row.difference));
    body.appendChild(line);
  });
  if (rows.length > 1) {
    const oldNet = rows.reduce((sum, row) => sum + Number(row.old), 0);
    const newNet = rows.reduce((sum, row) => sum + Number(row.new), 0);
    const line = document.createElement("tr");
    cell(line, "All days");
    cell(line, points(oldNet), tone(oldNet));
    cell(line, points(newNet), tone(newNet));
    cell(line, points(newNet - oldNet), tone(newNet - oldNet));
    body.appendChild(line);
  }
  table.appendChild(body);
  wrap.appendChild(table);
  return wrap;
}

function renderReport(body) {
  const wrap = document.createElement("div");
  const report = body.report || body.runs[body.runs.length - 1];
  const windowInfo = body.window || {};
  const intro = document.createElement("p");
  const asked = windowInfo.from_day && windowInfo.to_day
    ? ("Calendar " + windowInfo.from_day + " to " + windowInfo.to_day + ". ")
    : "";
  const from = windowInfo.from && windowInfo.to ? (windowInfo.from + " to " + windowInfo.to + ". ") : "";
  const days = windowInfo.days && windowInfo.days.length ? (windowInfo.days.length + " saved sessions. ") : "";
  const missing = windowInfo.missing && windowInfo.missing.length
    ? (" No bars for " + windowInfo.missing.join(", ") + ".")
    : "";
  const note = windowInfo.note ? (" " + windowInfo.note) : "";
  intro.textContent = asked + days + from + windowInfo.bars + " finished 10-minute bars. " +
    (windowInfo.source ? ("Source: " + windowInfo.source + ". ") : "") +
    missing + note;
  wrap.appendChild(intro);
  const settings = report.settings || {};
  const line = document.createElement("p");
  line.textContent = [
    "Entry " + (settings.entry || ""),
    "exit " + (settings.exit || ""),
    settings.stop_mode ? ("stop " + settings.stop_mode) : "",
    settings.take ? ("take " + settings.take) : "",
    settings.flatten ? ("clock " + settings.flatten) : "",
    "touch " + settings.touch,
    "chase " + settings.chase,
    "SMA band " + settings.sma_band,
    "ATR fraction " + settings.break_atr,
    "near " + settings.profit_near
  ].filter(Boolean).join(" · ");
  wrap.appendChild(line);
  const compared = parameterDays(body.parameter_days);
  if (compared) wrap.appendChild(compared);
  (body.sweeps || []).forEach((sweep) => wrap.appendChild(rangeChart(sweep)));
  wrap.appendChild(overview(report));
  wrap.appendChild(equityChart(report.summary.strategy.equity));
  wrap.appendChild(tradeTable(report.trades));
  if (body.runs) wrap.appendChild(comparison(body.runs));
  return wrap;
}

function rowValues(row) {
  const read = (name) => row.querySelector("[name=" + name + "]").value.trim();
  return {
    ticker: read("ticker").toUpperCase(),
    price: read("price"),
    allows: row.querySelector("[name=allows]").value,
    targets: read("targets"),
    up_targets: read("up_targets"),
    stop: read("stop"),
    note: read("note")
  };
}

function collectLevels() {
  return Array.from(document.querySelectorAll("#level-rows tr")).map((row) => {
    const values = rowValues(row);
    const split = (text) => text.split(",").map((item) => item.trim()).filter(Boolean).map(Number);
    const level = {
      ticker: values.ticker,
      price: values.price === "" ? "" : Number(values.price),
      allows: values.allows,
      targets: split(values.targets),
      note: values.note
    };
    if (values.up_targets) level.up_targets = split(values.up_targets);
    if (values.stop) level.stop = Number(values.stop);
    return level;
  }).filter((level) => level.ticker && level.price !== "");
}

function num(id) {
  const field = document.getElementById(id);
  const value = field ? field.value.trim() : "";
  if (value === "") return null;
  const number = Number(value);
  return Number.isNaN(number) ? null : number;
}

function payload() {
  return {
    armed_at: document.getElementById("armed-at").value,
    levels: collectLevels(),
    bars: document.getElementById("bars-source").value,
    from: document.getElementById("range-from").value,
    to: document.getElementById("range-to").value,
    touch: num("touch"),
    chase: num("chase"),
    sma_band: num("sma-band"),
    break_atr: num("break-atr"),
    profit_near: num("profit-near"),
    ranges: collectRanges(),
    steps: num("range-steps"),
    entry: document.getElementById("entry").value,
    exit: document.getElementById("exit-rule").value,
    exit_test: document.getElementById("exit-test").value,
    stop_mode: document.getElementById("stop-mode").value,
    take: document.getElementById("take-mode").value,
    flatten: document.getElementById("flatten-mode").value
  };
}

function rangeKnobs() {
  return Array.from(document.querySelectorAll(".range-knob"));
}

function syncRanges() {
  rangeKnobs().forEach((knob) => {
    const box = knob.querySelector("input[type=checkbox]");
    const bounds = knob.querySelector(".bounds");
    if (bounds) bounds.hidden = !(box && box.checked);
  });
}

function collectRanges() {
  return rangeKnobs().filter((knob) => {
    const box = knob.querySelector("input[type=checkbox]");
    return box && box.checked;
  }).map((knob) => ({
    name: knob.dataset.name,
    low: num(knob.dataset.low),
    high: num(knob.dataset.high)
  }));
}

function syncExitTest() {
  const custom = document.getElementById("exit-test").value === "custom";
  ["stop-mode", "take-mode", "flatten-mode"].forEach((id) => {
    const field = document.getElementById(id);
    if (field && field.parentElement) field.parentElement.hidden = !custom;
  });
}

function bindDesk() {
  const run = document.getElementById("run-backtest");
  if (!run) return;
  const exitTest = document.getElementById("exit-test");
  if (exitTest) {
    syncExitTest();
    exitTest.addEventListener("change", syncExitTest);
  }
  syncRanges();
  rangeKnobs().forEach((knob) => {
    const box = knob.querySelector("input[type=checkbox]");
    if (box) box.addEventListener("change", syncRanges);
  });
  document.getElementById("add-level").addEventListener("click", () => {
    const body = document.getElementById("level-rows");
    const copy = body.rows[0].cloneNode(true);
    copy.querySelectorAll("input").forEach((input) => { input.value = ""; });
    body.appendChild(copy);
  });
  run.addEventListener("click", async () => {
    const out = document.getElementById("backtest-out");
    out.textContent = "Computing from the bars.";
    try {
      const response = await fetch("/api/backtest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload())
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || "The backtest failed.");
      out.replaceChildren(renderReport(body));
    } catch (error) {
      out.textContent = error.message + " Start the desk with python3 scripts/dashboard.py serve.";
    }
  });
  document.getElementById("save-book").addEventListener("click", async () => {
    const out = document.getElementById("backtest-out");
    const response = await fetch("/api/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ armed_at: document.getElementById("armed-at").value, levels: collectLevels() })
    });
    const body = await response.json();
    out.textContent = response.ok ? "Saved the book. That does not place an order." : (body.error || "The book was not saved.");
  });
}
bindDesk();
</script>
